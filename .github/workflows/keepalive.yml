# Empêche la mise en pause du projet Supabase gratuit (après 7 jours sans activité) :
# appel hebdomadaire de /health, qui réveille l'API Render (jusqu'à ~1 min) puis interroge PostgreSQL.
name: Keep-alive base de données

on:
  schedule:
    - cron: "17 6 * * 1,4" # lundi et jeudi, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de /health (API + PostgreSQL)
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 \
            https://ismoc-studio-api.onrender.com/health
